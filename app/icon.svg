<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181816"/>
      <stop offset="100%" stop-color="#0c0c0a"/>
    </linearGradient>
    <filter id="dotGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#d4ff3f" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#f2f0e8" stroke-opacity="0.12" stroke-width="1.5"/>
  
  <!-- Monogram 'u' -->
  <path d="M 16 19.5 V 34 C 16 41.5 21 46.5 28.5 46.5 C 36 46.5 41 41.5 41 34 V 19.5" 
        stroke="#f2f0e8" 
        stroke-width="6.8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Signature Accent Dot '.' -->
  <circle cx="49.5" cy="43.5" r="4.2" fill="#d4ff3f" filter="url(#dotGlow)"/>
</svg>
